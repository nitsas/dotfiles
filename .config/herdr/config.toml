onboarding = false

[theme]
name = "solarized"
auto_switch = false

[keys]
prefix = "ctrl+space"
copy_mode = "prefix+space"
settings = "prefix+."
split_horizontal = ["prefix+minus", "prefix+s"]
focus_pane_left  = ["prefix+h", "ctrl+h"]
focus_pane_down  = ["prefix+j", "ctrl+j"]
focus_pane_up    = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
navigate_workspace_down = "j"
navigate_workspace_up = "k"
open_worktree = "prefix+o"
next_agent = "prefix+a"
new_tab = "prefix+t"
# new workspace = "prefix+shift+n" # default
# rename workspace = "prefix+shift+w" # default
# close_workspace = "prefix+shift+d" # default
# workspace picker = "prefix+shift+g" # default
# toggle sidebar = "prefix+b" # default

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "ronly2460.pane-mover.open"
description = "Move pane to workspace"
